# electron-builder configuration — produces a distributable macOS .dmg.
# Usage: npm run dist   (build the .dmg)
#        npm run pack   (unpacked .app in release/, faster for testing)

appId: com.codecanvas.app
productName: Code Canvas

directories:
  buildResources: build
  output: release

# Strict allowlist. Main, preload and renderer are all bundled by Vite into
# out/, so shipping node_modules would only duplicate ~300 MB of libraries
# (mermaid, d3, katex, monaco, …) that already live inside the renderer bundle.
# node-pty is the one exception: it is a native module that main loads at
# runtime, so its files ship as-is (and are unpacked, see asarUnpack below).
files:
  - '!**/*'
  - 'out/**'
  - 'node_modules/node-pty/**'
  - '!node_modules/node-pty/prebuilds/win32-*/**'
  - '!node_modules/node-pty/prebuilds/darwin-x64/**'
  - 'package.json'

# node-pty is a native module: its .node binary and spawn-helper must sit outside
# the asar archive, otherwise the terminal cannot spawn a shell at runtime.
asarUnpack:
  - '**/node_modules/node-pty/**'

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  darkModeSupport: true
  target:
    - target: dmg
      arch:
        - arm64
  # No Apple Developer certificate is available on this machine, so skip code
  # signing to keep local builds working. Remove this once you have an identity.
  identity: null

dmg:
  title: Code Canvas
  contents:
    - x: 140
      y: 200
    - x: 420
      y: 200
      type: link
      path: /Applications
